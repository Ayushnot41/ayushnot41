<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 400 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111722"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
</defs>

  <style>
    @keyframes lineReveal {
      0% { opacity: 0; transform: translateY(-2px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .ascii-text {
      font-size: 10.5px;
      fill: #38bdf8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      opacity: 0;
      animation: lineReveal 0.08s ease-out forwards;
    }
    .l-0 { animation-delay: 0.000s; }
    .l-1 { animation-delay: 0.040s; }
    .l-2 { animation-delay: 0.080s; }
    .l-3 { animation-delay: 0.120s; }
    .l-4 { animation-delay: 0.160s; }
    .l-5 { animation-delay: 0.200s; }
    .l-6 { animation-delay: 0.240s; }
    .l-7 { animation-delay: 0.280s; }
    .l-8 { animation-delay: 0.320s; }
    .l-9 { animation-delay: 0.360s; }
    .l-10 { animation-delay: 0.400s; }
    .l-11 { animation-delay: 0.440s; }
    .l-12 { animation-delay: 0.480s; }
    .l-13 { animation-delay: 0.520s; }
    .l-14 { animation-delay: 0.560s; }
    .l-15 { animation-delay: 0.600s; }
    .l-16 { animation-delay: 0.640s; }
    .l-17 { animation-delay: 0.680s; }
    .l-18 { animation-delay: 0.720s; }
    .l-19 { animation-delay: 0.760s; }
    .l-20 { animation-delay: 0.800s; }
    .l-21 { animation-delay: 0.840s; }
    .l-22 { animation-delay: 0.880s; }
  </style>

<!-- Terminal Window Container -->
<rect width="400" height="360" rx="12" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="399" height="359" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
<line x1="0" y1="30" x2="400" y2="30" stroke="#30363d"/>
<circle cx="16" cy="15" r="4.5" fill="#ff5f56"/>
<circle cx="30" cy="15" r="4.5" fill="#ffbd2e"/>
<circle cx="44" cy="15" r="4.5" fill="#27c93f"/>
<text x="200.0" y="19" fill="#7d8590" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">ayush@github: ~$ ./portrait.sh</text>

<!-- Universal Cross-Device Line-by-Line Reveal -->
<g>
