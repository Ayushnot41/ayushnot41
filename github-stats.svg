  <text x="25" y="165" fill="#e2e8f0" font-size="12.5">⚡ Enterprise, SaaS &amp; Web3 Systems:</text>
  <text x="375" y="165" fill="#fbbf24" font-size="13.5" font-weight="bold" text-anchor="end">18 Repositories</text>

  <rect x="25" y="190" width="360" height="20" rx="10" fill="#161b22"/>
