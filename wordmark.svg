<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="240" style="background: #0d1117; border-radius: 12px; border: 1px solid #30363d;">
  <style>
    .wordmark-main {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 32px;
      font-weight: 900;
      fill: #38bdf8;
      letter-spacing: 4px;
    }
    .wordmark-sub {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 14px;
      fill: #a855f7;
      letter-spacing: 2px;
    }
    .wordmark-desc {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 12px;
      fill: #94a3b8;
    }
    .grid-line { stroke: #1e293b; stroke-width: 1; }
    
    @keyframes rock {
      0%, 100% { transform: rotateY(0deg); }
      50% { transform: rotateY(8deg); }
    }
    .animated-group {
      transform-origin: center;
      animation: rock 6s ease-in-out infinite;
    }
  </style>

  <line x1="20" y1="40" x2="480" y2="40" class="grid-line"/>
  <line x1="20" y1="80" x2="480" y2="80" class="grid-line"/>
  <line x1="20" y1="120" x2="480" y2="120" class="grid-line"/>
  <line x1="20" y1="160" x2="480" y2="160" class="grid-line"/>
  <line x1="20" y1="200" x2="480" y2="200" class="grid-line"/>

  <g class="animated-group">
    <text x="27" y="77" class="wordmark-main" fill="#1e293b" opacity="0.6">AYUSH SARKAR</text>
    <text x="26" y="76" class="wordmark-main" fill="#0284c7" opacity="0.8">AYUSH SARKAR</text>
    <text x="25" y="75" class="wordmark-main">AYUSH SARKAR</text>

    <text x="25" y="115" class="wordmark-sub">⚡ FULL-STACK &amp; AI SYSTEMS ARCHITECT</text>
    
    <rect x="25" y="135" width="450" height="75" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="40" y="160" class="wordmark-desc" fill="#4ade80">const engineer = new SystemsArchitect({</text>
    <text x="55" y="180" class="wordmark-desc" fill="#e2e8f0">  specialty: ["Multi-Agent AI", "Geospatial Systems"],</text>
    <text x="55" y="198" class="wordmark-desc" fill="#38bdf8">  stack: ["Next.js 14", "LangGraph", "Spring Boot"]</text>
    <text x="40" y="200" class="wordmark-desc" fill="#4ade80">});</text>
  </g>
</svg>