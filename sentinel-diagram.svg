<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240" style="background: #0d1117; border-radius: 12px; border: 1px solid #30363d; font-family: 'Fira Code', 'Courier New', monospace;">
  <style>
    .node-title { fill: #f8fafc; font-weight: bold; font-size: 13px; }
    .node-sub { fill: #94a3b8; font-size: 11px; }
    .arrow { stroke: #4ade80; stroke-width: 2; marker-end: url(#arrowhead-green); }
  </style>

  <defs>
    <marker id="arrowhead-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4ade80" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="25" y="30" fill="#4ade80" font-size="14" font-weight="bold">📡 SENTINEL AI TELEMETRY &amp; GEOFENCING DIAGRAM</text>

  <!-- Step 1: GPS Stream -->
  <rect x="25" y="55" width="200" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="125" cy="85" r="16" fill="#0284c7" />
  <text x="125" y="90" text-anchor="middle" fill="#ffffff" font-size="14">🛰️</text>
  <text x="125" y="125" text-anchor="middle" class="node-title">GPS Ingestion Stream</text>
  <text x="125" y="145" text-anchor="middle" class="node-sub">High-Freq Coordinate Pings</text>
  <text x="125" y="165" text-anchor="middle" class="node-sub">Mobile / IoT Sensors</text>

  <!-- Arrow 1 -->
  <line x1="225" y1="130" x2="265" y2="130" class="arrow" />

  <!-- Step 2: Processing Engine -->
  <rect x="275" y="55" width="240" height="150" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="395" cy="85" r="16" fill="#059669" />
  <text x="395" y="90" text-anchor="middle" fill="#ffffff" font-size="14">⚡</text>
  <text x="395" y="120" text-anchor="middle" class="node-title" fill="#6ee7b7">Haversine Spatial Engine</text>
  <text x="395" y="140" text-anchor="middle" class="node-sub">PostgreSQL + PostGIS Query</text>
  <text x="395" y="160" text-anchor="middle" class="node-sub">Upstash Redis Active State</text>
  <text x="395" y="180" text-anchor="middle" class="node-sub">Geofence Perimeter Checks</text>

  <!-- Arrow 2 -->
  <line x1="515" y1="130" x2="555" y2="130" class="arrow" />

  <!-- Step 3: Real-Time Map & Alerts -->
  <rect x="565" y="55" width="210" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="670" cy="85" r="16" fill="#dc2626" />
  <text x="670" y="90" text-anchor="middle" fill="#ffffff" font-size="14">🗺️</text>
  <text x="670" y="120" text-anchor="middle" class="node-title">Mapbox Dashboard</text>
  <text x="670" y="140" text-anchor="middle" class="node-sub">Live Marker Trajectories</text>
  <text x="670" y="160" text-anchor="middle" class="node-sub">🚨 Sub-Second Threat Alerts</text>
</svg>