<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240" style="background: #0d1117; border-radius: 12px; border: 1px solid #30363d; font-family: 'Fira Code', 'Courier New', monospace;">
  <style>
    .node-title { fill: #f8fafc; font-weight: bold; font-size: 13px; }
    .node-sub { fill: #94a3b8; font-size: 11px; }
    .arrow { stroke: #38bdf8; stroke-width: 2; marker-end: url(#arrowhead); }
    .accent-purple { fill: #a855f7; }
    .accent-blue { fill: #38bdf8; }
    .accent-green { fill: #4ade80; }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="25" y="30" fill="#38bdf8" font-size="14" font-weight="bold">🔮 VIBEFORGE MULTI-AGENT ARCHITECTURE DIAGRAM</text>

  <!-- Step 1: Input -->
  <rect x="25" y="55" width="160" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="105" cy="85" r="16" fill="#0284c7" />
  <text x="105" y="90" text-anchor="middle" fill="#ffffff" font-size="14">🎯</text>
  <text x="105" y="125" text-anchor="middle" class="node-title">User Life Goal</text>
  <text x="105" y="145" text-anchor="middle" class="node-sub">Next.js 14 Wizard</text>
  <text x="105" y="165" text-anchor="middle" class="node-sub">Edge API Routes</text>

  <!-- Arrow 1 -->
  <line x1="185" y1="130" x2="225" y2="130" class="arrow" />

  <!-- Step 2: LangGraph Core -->
  <rect x="235" y="55" width="230" height="150" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="350" cy="85" r="16" fill="#7c3aed" />
  <text x="350" y="90" text-anchor="middle" fill="#ffffff" font-size="14">🧠</text>
  <text x="350" y="120" text-anchor="middle" class="node-title" fill="#a855f7">LangGraph Pipeline</text>
  <text x="350" y="140" text-anchor="middle" class="node-sub">Claude Sonnet 4 (Simulations)</text>
  <text x="350" y="160" text-anchor="middle" class="node-sub">Groq Llama 3.3 (Deployer)</text>
  <text x="350" y="180" text-anchor="middle" class="node-sub">Obstacle Loop (&gt;70% prob)</text>

  <!-- Arrow 2 -->
  <line x1="465" y1="130" x2="505" y2="130" class="arrow" />

  <!-- Step 3: Multimedia Output -->
  <rect x="515" y="55" width="260" height="150" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <circle cx="645" cy="85" r="16" fill="#16a34a" />
  <text x="645" y="90" text-anchor="middle" fill="#ffffff" font-size="14">✨</text>
  <text x="645" y="120" text-anchor="middle" class="node-title">Synthetic Output</text>
  <text x="645" y="140" text-anchor="middle" class="node-sub">🎨 DALL-E 3 Future Memories</text>
  <text x="645" y="160" text-anchor="middle" class="node-sub">🎙️ ElevenLabs Voice Narration</text>
  <text x="645" y="180" text-anchor="middle" class="node-sub">📊 Three.js 3D Particle Timeline</text>
</svg>