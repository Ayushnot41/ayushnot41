  <text x="25" y="35" fill="#38bdf8" font-size="13" font-weight="bold">📊 GitHub Ecosystem &amp; System Analytics</text>
  
  <text x="25" y="75" fill="#e2e8f0" font-size="12.5">📦 Total Public Repositories:</text>
  <text x="375" y="75" fill="#4ade80" font-size="13.5" font-weight="bold" text-anchor="end">43 Repositories</text>
  
