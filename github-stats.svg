  <rect x="645" y="155" width="170" height="12" rx="6" fill="#161b22"/>
  <rect x="645" y="155" width="19" height="12" rx="6" fill="#f7df1e"/>

  <!-- Specialized: Solidity, Python, PostGIS, SQL -->
  <text x="455" y="195" fill="#e2e8f0" font-size="12" font-weight="600">Solidity, Python &amp; SQL (Specialized)</text>
  <rect x="645" y="185" width="170" height="12" rx="6" fill="#161b22"/>
  <rect x="645" y="185" width="170" height="12" rx="6" fill="#a855f7" opacity="0.8"/>
