  <text xml:space="preserve" x="15" y="342.3" fill="#38bdf8" font-size="10.5" textLength="370" lengthAdjust="spacing">::------:..:-.  :+#%%%%#*=  .. .          :..:</text>
</g>

<!-- Leading Terminal Drawing Line Cursor -->
<line x1="15" y1="40" x2="385" y2="40" stroke="#38bdf8" stroke-width="1.5" opacity="0">
  <animate attributeName="y1" from="40" to="345" begin="0.1s" dur="2.2s" fill="freeze" calcMode="linear"/>
  <animate attributeName="y2" from="40" to="345" begin="0.1s" dur="2.2s" fill="freeze" calcMode="linear"/>
  <set attributeName="opacity" to="0.9" begin="0.1s"/>
  <set attributeName="opacity" to="0" begin="2.35s"/>
</line>
</svg>