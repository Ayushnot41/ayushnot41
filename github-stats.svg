  <rect x="430" y="0" width="410" height="230" rx="12" fill="url(#stat-bg)" stroke="#30363d" stroke-width="1"/>
  <rect x="445" y="15" width="380" height="30" rx="6" fill="#161b22"/>
  <text x="455" y="35" fill="#a855f7" font-size="13" font-weight="bold">💻 Codebase Language &amp; Stack Distribution</text>

