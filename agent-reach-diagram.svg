<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="290" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="ar-card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="ar-card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="ar-card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="ar-card4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <marker id="arrow-ar" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
  </defs>

  <rect width="900" height="290" rx="14" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title Banner -->
  <rect x="25" y="18" width="850" height="34" rx="8" fill="#1e1b4b"/>
  <text x="450" y="41" fill="#c084fc" font-size="15" font-weight="bold" text-anchor="middle">🤖 AGENT-REACH: ZERO-FEE MULTI-PLATFORM AI SCRAPER (COLOR BLOCK DIAGRAM)</text>

  <!-- Block 1: AI Agent Query -->
  <rect x="25" y="68" width="190" height="195" rx="10" fill="url(#ar-card1)" stroke="#a855f7" stroke-width="2"/>
  <rect x="35" y="78" width="170" height="30" rx="6" fill="#3b0764"/>
  <text x="120" y="98" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">1. Agent Request</text>
  <text x="42" y="132" fill="#f3e8ff" font-size="12" font-weight="600">• Agent CLI Prompt</text>
  <text x="42" y="157" fill="#f3e8ff" font-size="12">• Search Intent Query</text>
  <text x="42" y="182" fill="#f3e8ff" font-size="12">• Antigravity &amp; Claude</text>
  <text x="42" y="207" fill="#f3e8ff" font-size="12">• Zero-API-Fee Protocol</text>
  <text x="42" y="232" fill="#f3e8ff" font-size="12">• Autonomous Trigger</text>

  <!-- Arrow 1 -->
  <line x1="215" y1="165" x2="242" y2="165" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow-ar)"/>

  <!-- Block 2: Multi-Platform Ingestion Driver -->
  <rect x="250" y="68" width="205" height="195" rx="10" fill="url(#ar-card2)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="260" y="78" width="185" height="30" rx="6" fill="#082f49"/>
  <text x="352" y="98" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">2. Scraper Gateway</text>
  <text x="268" y="132" fill="#e0f2fe" font-size="12" font-weight="600">• Twitter / X Ingest</text>
  <text x="268" y="157" fill="#e0f2fe" font-size="12">• Reddit &amp; YouTube</text>
  <text x="268" y="182" fill="#e0f2fe" font-size="12">• GitHub Code Search</text>
  <text x="268" y="207" fill="#e0f2fe" font-size="12">• Bilibili / XiaoHongShu</text>
  <text x="268" y="232" fill="#e0f2fe" font-size="12">• Headless Engine</text>

  <!-- Arrow 2 -->
  <line x1="455" y1="165" x2="482" y2="165" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow-ar)"/>

  <!-- Block 3: Content Sanitizer & Parser -->
  <rect x="490" y="68" width="180" height="195" rx="10" fill="url(#ar-card4)" stroke="#fbbf24" stroke-width="2"/>
  <rect x="500" y="78" width="160" height="30" rx="6" fill="#78350f"/>
  <text x="580" y="98" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">3. Parser &amp; Clean</text>
  <text x="508" y="132" fill="#fef3c7" font-size="12" font-weight="600">• HTML to Markdown</text>
  <text x="508" y="157" fill="#fef3c7" font-size="12">• Noise &amp; Ad Removal</text>
  <text x="508" y="182" fill="#fef3c7" font-size="12">• Structured JSON Output</text>
  <text x="508" y="207" fill="#fef3c7" font-size="12">• Token Optimization</text>
  <text x="508" y="232" fill="#fef3c7" font-size="12">• Metadata Extraction</text>

  <!-- Arrow 3 -->
  <line x1="670" y1="165" x2="697" y2="165" stroke="#a855f7" stroke-width="3" marker-end="url(#arrow-ar)"/>

  <!-- Block 4: Agent Ingestion Feed -->
  <rect x="705" y="68" width="170" height="195" rx="10" fill="url(#ar-card3)" stroke="#34d399" stroke-width="2"/>
  <rect x="715" y="78" width="150" height="30" rx="6" fill="#064e3b"/>
  <text x="790" y="98" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">4. AI Ingestion</text>
  <text x="720" y="132" fill="#d1fae5" font-size="12" font-weight="600">• 🧠 LLM Context Feed</text>
  <text x="720" y="157" fill="#d1fae5" font-size="12">• ⚡ Real-Time RAG</text>
  <text x="720" y="182" fill="#d1fae5" font-size="12">• 📋 Structured Citations</text>
  <text x="720" y="207" fill="#d1fae5" font-size="12">• 🔍 Zero-Fee Search</text>
  <text x="720" y="232" fill="#d1fae5" font-size="12">• 🚀 Sub-Second Yield</text>
</svg>