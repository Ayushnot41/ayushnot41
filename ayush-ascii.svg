<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 400 360">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111722"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
</defs>
<style>
  @keyframes reveal {
    from { clip-path: inset(0 0 100% 0); }
    to   { clip-path: inset(0 0 0% 0); }
  }
  .portrait {
    animation: reveal 1.6s ease-out forwards;
  }
</style>
<rect width="400" height="360" rx="12" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="399" height="359" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
