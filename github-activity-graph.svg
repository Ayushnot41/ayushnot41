<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" width="100%" height="220" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="actg-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111722"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="curve-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    /* Continuous infinite live motion */
    @keyframes liveScan {
      0%   { transform: translateX(0px); opacity: 0.1; }
      50%  { opacity: 0.8; }
      100% { transform: translateX(720px); opacity: 0.1; }
    }

    @keyframes livePulse {
      0%   { r: 5; fill-opacity: 1; stroke-width: 1.5; }
      50%  { r: 8; fill-opacity: 0.6; stroke-width: 3; stroke: #38bdf8; }
      100% { r: 5; fill-opacity: 1; stroke-width: 1.5; }
    }

    @keyframes waveMotion {
      0%   { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }

    @keyframes liveSignal {
      0%   { opacity: 0.4; }
      50%  { opacity: 1; }
      100% { opacity: 0.4; }
    }

    .live-scanline {
      animation: liveScan 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .pulse-node-1 { animation: livePulse 2.4s ease-in-out 0.2s infinite; }
    .pulse-node-2 { animation: livePulse 2.4s ease-in-out 0.6s infinite; }
    .pulse-node-3 { animation: livePulse 2.4s ease-in-out 1.0s infinite; }
    .pulse-node-4 { animation: livePulse 2.4s ease-in-out 1.4s infinite; }
    .pulse-node-5 { animation: livePulse 2.4s ease-in-out 1.8s infinite; }
    .pulse-node-6 { animation: livePulse 1.6s ease-in-out infinite; }

    .moving-stream {
      stroke-dasharray: 8, 4;
      animation: waveMotion 1.2s linear infinite;
    }

    .live-badge {
      animation: liveSignal 1.5s ease-in-out infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="840" height="220" rx="12" fill="url(#actg-bg)" stroke="#30363d" stroke-width="1"/>

  <!-- Header Bar -->
  <rect x="20" y="15" width="800" height="30" rx="6" fill="#161b22"/>
  <circle cx="35" cy="30" r="4.5" fill="#22c55e" class="live-badge"/>
  <text x="48" y="35" fill="#38bdf8" font-size="13" font-weight="bold">🔴 LIVE: Project Shipping Velocity &amp; Active Development Milestones</text>
  <text x="805" y="35" fill="#22c55e" font-size="11" font-weight="bold" text-anchor="end" class="live-badge">● STREAMING 60 FPS</text>

  <!-- Grid Lines -->
  <line x1="50" y1="75" x2="800" y2="75" stroke="#1e293b" stroke-dasharray="3,3"/>
  <line x1="50" y1="115" x2="800" y2="115" stroke="#1e293b" stroke-dasharray="3,3"/>
  <line x1="50" y1="155" x2="800" y2="155" stroke="#1e293b" stroke-dasharray="3,3"/>

  <!-- Y-Axis Labels -->
  <text x="38" y="79" fill="#64748b" font-size="10" text-anchor="end">High</text>
  <text x="38" y="119" fill="#64748b" font-size="10" text-anchor="end">Med</text>
  <text x="38" y="159" fill="#64748b" font-size="10" text-anchor="end">Low</text>

  <!-- Continuous Moving Area Gradient Fill -->
  <path d="M 50 155 Q 110 148 170 140 T 290 115 T 410 110 T 530 80 T 650 70 T 770 50 L 770 155 L 50 155 Z" fill="url(#curve-grad)"/>

  <!-- Base Trajectory Solid Glow Line -->
  <path d="M 50 155 Q 110 148 170 140 T 290 115 T 410 110 T 530 80 T 650 70 T 770 50" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- Moving Data Stream Line (Continuous Live Motion) -->
  <path class="moving-stream" d="M 50 155 Q 110 148 170 140 T 290 115 T 410 110 T 530 80 T 650 70 T 770 50" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Continuous Live Scanning Radar Laser -->
  <g class="live-scanline">
    <rect x="50" y="55" width="40" height="105" fill="url(#laser-grad)"/>
    <line x1="70" y1="55" x2="70" y2="160" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Continuously Pulsing Live Milestone Nodes -->
  <circle class="pulse-node-1" cx="170" cy="140" fill="#ed8b00" stroke="#ffffff" stroke-width="1.5"/>
  <circle class="pulse-node-2" cx="290" cy="115" fill="#3178c6" stroke="#ffffff" stroke-width="1.5"/>
  <circle class="pulse-node-3" cx="410" cy="110" fill="#627eea" stroke="#ffffff" stroke-width="1.5"/>
  <circle class="pulse-node-4" cx="530" cy="80"  fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
  <circle class="pulse-node-5" cx="650" cy="70"  fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
  <circle class="pulse-node-6" cx="770" cy="50"  fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>

  <!-- Milestone Text Labels -->
  <text x="170" y="160" fill="#cbd5e1" font-size="9" text-anchor="middle">Hotel Portal</text>
  <text x="290" y="135" fill="#cbd5e1" font-size="9" text-anchor="middle">PayrollPro</text>
  <text x="410" y="130" fill="#cbd5e1" font-size="9" text-anchor="middle">SkillBadge</text>
  <text x="530" y="100" fill="#cbd5e1" font-size="9" text-anchor="middle">agent-reach</text>
  <text x="650" y="90"  fill="#cbd5e1" font-size="9" text-anchor="middle">Sentinel AI</text>
  <text x="770" y="40"  fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">VibeForge 🚀</text>

  <!-- X-Axis Timeline Labels -->
  <text x="50"  y="185" fill="#7d8590" font-size="11">Dec 2024</text>
  <text x="170" y="185" fill="#7d8590" font-size="11">Q1 2025</text>
  <text x="290" y="185" fill="#7d8590" font-size="11">Q2 2025</text>
  <text x="410" y="185" fill="#7d8590" font-size="11">Q3 2025</text>
  <text x="530" y="185" fill="#7d8590" font-size="11">Q4 2025</text>
  <text x="650" y="185" fill="#7d8590" font-size="11">Q1 2026</text>
  <text x="770" y="185" fill="#7d8590" font-size="11">Current ⚡</text>

  <!-- Active Status Tag -->
  <rect x="580" y="195" width="220" height="20" rx="4" fill="#1e293b"/>
  <text x="690" y="209" fill="#4ade80" font-size="10.5" font-weight="bold" text-anchor="middle">Live Velocity: 11 Active Systems Built</text>
</svg>