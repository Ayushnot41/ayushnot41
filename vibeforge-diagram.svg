<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="100%" height="250" style="background: #0b0f19; border-radius: 14px; border: 1px solid #1e293b; font-family: 'Fira Code', 'Segoe UI', sans-serif;">
  <defs>
    <linearGradient id="grad-input" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="grad-output" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <marker id="arrow-vibe" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="25" y="32" fill="#38bdf8" font-size="15" font-weight="bold">🔮 VIBEFORGE MULTI-AGENT PIPELINE (VIBRANT ARCHITECTURE DIAGRAM)</text>

  <!-- Card 1: Input -->
  <rect x="25" y="55" width="210" height="165" rx="12" fill="url(#grad-input)" stroke="#38bdf8" stroke-width="2"/>
  <rect x="35" y="65" width="190" height="32" rx="6" fill="#0c4a6e" opacity="0.6"/>
  <text x="130" y="86" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🎯 User Goal &amp; Input</text>
  <text x="45" y="122" fill="#e0f2fe" font-size="12">• Next.js 14 4-Step Form</text>
  <text x="45" y="145" fill="#e0f2fe" font-size="12">• Trajectory Selection</text>
  <text x="45" y="168" fill="#e0f2fe" font-size="12">• Edge API Routes Ingest</text>
  <text x="45" y="191" fill="#e0f2fe" font-size="12">• Supabase Auth &amp; State</text>

  <!-- Connection Line 1 -->
  <line x1="235" y1="138" x2="280" y2="138" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-vibe)" />

  <!-- Card 2: LangGraph Core Orchestration -->
  <rect x="290" y="55" width="240" height="165" rx="12" fill="url(#grad-core)" stroke="#a855f7" stroke-width="2"/>
  <rect x="300" y="65" width="220" height="32" rx="6" fill="#2e1065" opacity="0.6"/>
  <text x="410" y="86" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">🧠 LangGraph Orchestration</text>
  <text x="310" y="122" fill="#f3e8ff" font-size="12">• Claude Sonnet 4 (Simulator)</text>
  <text x="310" y="145" fill="#f3e8ff" font-size="12">• Groq Llama 3.3 70B (Deployer)</text>
  <text x="310" y="168" fill="#f3e8ff" font-size="12">• Supabase pgvector Embeddings</text>
  <text x="310" y="191" fill="#f3e8ff" font-size="12">• Feedback Loop (&gt;70% Obstacle)</text>

  <!-- Connection Line 2 -->
  <line x1="530" y1="138" x2="575" y2="138" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow-vibe)" />

  <!-- Card 3: Multimedia Output Generation -->
  <rect x="585" y="55" width="210" height="165" rx="12" fill="url(#grad-output)" stroke="#34d399" stroke-width="2"/>
  <rect x="595" y="65" width="190" height="32" rx="6" fill="#064e3b" opacity="0.6"/>
  <text x="690" y="86" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">✨ Synthetic Outputs</text>
  <text x="600" y="122" fill="#d1fae5" font-size="12">• 🎨 DALL-E 3 Images</text>
  <text x="600" y="145" fill="#d1fae5" font-size="12">• 🎙️ ElevenLabs Narration</text>
  <text x="600" y="168" fill="#d1fae5" font-size="12">• 📊 Three.js 3D Particle UI</text>
  <text x="600" y="191" fill="#d1fae5" font-size="12">• 📋 12-Week Action Plans</text>
</svg>