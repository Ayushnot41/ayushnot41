<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 400 360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#111722"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </linearGradient>
  <clipPath id="smooth-line-reveal">
    <rect x="10" y="40" width="380" height="0">
      <animate attributeName="height" from="0" to="315" begin="0.1s" dur="2.2s" fill="freeze" calcMode="linear"/>
    </rect>
  </clipPath>
</defs>

<!-- Window Container -->
<rect width="400" height="360" rx="12" fill="url(#bg)"/>
<rect x="0.5" y="0.5" width="399" height="359" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
<line x1="0" y1="30" x2="400" y2="30" stroke="#30363d"/>
<circle cx="16" cy="15" r="4.5" fill="#ff5f56"/>
<circle cx="30" cy="15" r="4.5" fill="#ffbd2e"/>
<circle cx="44" cy="15" r="4.5" fill="#27c93f"/>
<text x="200.0" y="19" fill="#7d8590" font-size="11" text-anchor="middle">ayush@github: ~$ ./portrait.sh</text>

<!-- Smooth Hardware-Accelerated Line Reveal -->
<g clip-path="url(#smooth-line-reveal)">
