<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<defs>
  <linearGradient id="wbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111722"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
</defs>
<rect width="840" height="420" rx="12" fill="url(#wbg)"/>
<rect x="0.5" y="0.5" width="839" height="419" rx="12" fill="none" stroke="#30363d" stroke-width="1"/>
<line x1="0" y1="30" x2="840" y2="30" stroke="#30363d"/>
<circle cx="20" cy="15.0" r="5" fill="#ff5f56"/>
<circle cx="36" cy="15.0" r="5" fill="#ffbd2e"/>
<circle cx="52" cy="15.0" r="5" fill="#27c93f"/>
<text x="420" y="19.0" fill="#7d8590" font-size="12" text-anchor="middle">ayush@github: ~$ ./wordmark.sh --3d</text>

<clipPath id="wipe">
  <rect x="20" y="40" height="360" width="0">
    <animate attributeName="width" from="0" to="800" begin="0s" dur="1.2s" fill="freeze"/>
  </rect>
</clipPath>

<g clip-path="url(#wipe)">
  <!-- 3D ASCII Extruded Header -->
  <text x="50" y="100" fill="#1e293b" font-size="36" font-weight="900" letter-spacing="6">AYUSH SARKAR</text>
  <text x="48" y="98" fill="#0284c7" font-size="36" font-weight="900" letter-spacing="6">AYUSH SARKAR</text>
  <text x="46" y="96" fill="#38bdf8" font-size="36" font-weight="900" letter-spacing="6">AYUSH SARKAR</text>
  
  <text x="50" y="135" fill="#a855f7" font-size="15" font-weight="bold" letter-spacing="2">⚡ FULL-STACK &amp; AI SYSTEMS ARCHITECT</text>
  
  <!-- Terminal Code Block Box -->
  <rect x="46" y="160" width="748" height="210" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="66" y="195" fill="#4ade80" font-size="14">const engineer = {</text>
  <text x="90" y="225" fill="#e2e8f0" font-size="14">name: <tspan fill="#38bdf8">"Ayush Sarkar"</tspan>,</text>
  <text x="90" y="255" fill="#e2e8f0" font-size="14">location: <tspan fill="#fbbf24">"Kolkata, India 📍"</tspan>,</text>
  <text x="90" y="285" fill="#e2e8f0" font-size="14">specialization: [<tspan fill="#f43f5e">"Multi-Agent AI"</tspan>, <tspan fill="#a855f7">"Geospatial Telemetry"</tspan>, <tspan fill="#22c55e">"Enterprise Full-Stack"</tspan>],</text>
  <text x="90" y="315" fill="#e2e8f0" font-size="14">agenticCLIs: [<tspan fill="#38bdf8">"Antigravity"</tspan>, <tspan fill="#fb923c">"Claude Code"</tspan>, <tspan fill="#c084fc">"OpenCode"</tspan>, <tspan fill="#4ade80">"MemoCode"</tspan>]</text>
  <text x="66" y="345" fill="#4ade80" font-size="14">};</text>
</g>
</svg>